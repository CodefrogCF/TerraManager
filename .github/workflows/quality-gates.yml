name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Format, analyze, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        # subosito/flutter-action v2.17.0
        uses: subosito/flutter-action@74af56c5ed2697ba4621264652728e8d217e53d3
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          java -version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify dependency lock
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Verify Android Gradle locks
        run: |
          git diff --exit-code -- android
          test -z "$(git ls-files --others --exclude-standard -- 'android/*.lockfile' 'android/app/*.lockfile' 'android/gradle-locks/*.lockfile')"

      - name: Build Drift Web worker
        run: dart compile js -O4 web/drift_worker.dart -o web/drift_worker.dart.js

      - name: Build Web release
        run: flutter build web --release

  shared-care-server:
    name: Build and smoke-test Shared Care server (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        # docker/setup-qemu-action v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Verify locked server dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/server-dependencies"
          cp deploy/server/pubspec.yaml deploy/server/pubspec.lock "$RUNNER_TEMP/server-dependencies/"
          docker run --rm --platform linux/arm64 \
            --mount "type=bind,source=$RUNNER_TEMP/server-dependencies,target=/src" \
            --workdir /src dart:3.13.4 dart pub get --enforce-lockfile
          cmp deploy/server/pubspec.lock "$RUNNER_TEMP/server-dependencies/pubspec.lock"

      - name: Build production server image
        run: |
          docker buildx build --platform linux/arm64 \
            --file deploy/server.Dockerfile \
            --tag terramanager-server:ci --load .

      - name: Smoke-test administrator setup and health endpoint
        run: python3 tool/ci/shared_server_smoke.py terramanager-server:ci
