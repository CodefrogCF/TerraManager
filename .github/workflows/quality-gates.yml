name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Format, analyze, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        # subosito/flutter-action v2.17.0
        uses: subosito/flutter-action@74af56c5ed2697ba4621264652728e8d217e53d3
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          java -version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify dependency lock
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Web release
        run: flutter build web --release
