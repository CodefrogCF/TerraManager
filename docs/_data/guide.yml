de:
  locale: de_DE
  title: TerraManager Guide – Schnellstart und täglicher Workflow
  description: Visueller TerraManager Guide für Boxen, Tiere, QR-Codes, Fütterungen, Erinnerungen, Archivierung und Backups.
  skip: Zum Inhalt springen
  nav_label: Guide-Navigation
  nav:
    start: Schnellstart
    qr: QR & Scanner
    feeding: Fütterungen
    backup: Backup
    shared: Gemeinsam betreuen
  language_label: Sprache wechseln
  language_name: English
  home_label: Startseite
  hero:
    eyebrow: Visueller Schnellstart
    heading: TerraManager in wenigen Schritten
    body: Vom ersten Behälter bis zur täglichen Fütterungsroutine – dieser Guide zeigt die wichtigsten Abläufe direkt an der App.
    primary: Guide starten
    manual: Vollständiges Handbuch
    image: animals-overview.webp
    image_alt: Tierübersicht in TerraManager
  jump:
    heading: Direkt zum Thema
    items:
    - number: '01'
      target: start
      title: Bestand anlegen
      body: Boxen und Tiere erfassen
    - number: '02'
      target: qr
      title: QR-Codes nutzen
      body: Drucken, anbringen, scannen
    - number: '03'
      target: feeding
      title: Fütterungen
      body: Einzeln oder per Box-Scan
    - number: '04'
      target: reminders
      title: Erinnerungen
      body: Intervalle und Fälligkeiten
    - number: '05'
      target: archive
      title: Archivieren
      body: Historie statt Löschen
    - number: '06'
      target: backup
      title: Daten sichern
      body: Backup und Wiederherstellung
    - number: '07'
      target: shared-care
      title: Gemeinsam betreuen
      body: Eine Sammlung im eigenen Netzwerk
  sections:
  - id: start
    number: '01'
    eyebrow: Bestand anlegen
    heading: Boxen und Tiere bilden die Grundlage
    lead: Lege zuerst eine Box und danach ein Tier mit Zuordnung zu einer aktiven Box an. Die optionale Einführung kannst du überspringen oder in Einstellungen erneut öffnen.
    heading_image:
      file: box_detail.webp
      alt: Detailansicht einer Box
      caption: Boxdetailansicht
    steps:
    - number: '1'
      heading: Box anlegen
      body_html: Öffne <strong>Boxen → +</strong>. Ergänze Namen, Abmessungen und optional ein zugeschnittenes Bild. Beim Speichern entsteht die permanente QR-Kennung. Unter <strong>Boxpflege</strong> in den Boxdetails erfasst du Substratwechsel, Reinigung oder Wasserwechsel mit Zeitpunkt und optionaler Notiz. Den Zugang findest du oben rechts neben Bearbeiten; Pflegeeinträge ergänzt du über + in einem kompakten Dialog wie bei Fütterungen. Der Verlauf bleibt in Standalone und Shared Care bei der Box. Eigene Pflegearten legst du direkt im Pflegeverlauf über <strong>Eigene Pflegearten</strong> an und verwaltest sie dort. Archivierte Arten bleiben im Verlauf filterbar.
      images:
      - file: boxes-overview.webp
        alt: Boxübersicht mit mehreren Behältern
        caption: Boxübersicht
      - file: box-create.webp
        alt: Maske zum Erstellen einer neuen Box
        caption: Neue Box erstellen
    - number: '2'
      reverse: true
      heading: Tier erfassen und zuweisen
      body_html: Unter <strong>Tiere → +</strong> wählst du eine aktive Box, Kategorie, Namen und Haltungswerte. Herkunft, Geburtsinformationen und weitere Angaben sind optional. Gewicht und Häutung lassen sich in den Details unabhängig ausblenden, ohne Verläufe zu löschen. Unter <strong>Eigene Felder → Feldvorlagen verwalten</strong> in Tier- oder Boxprofilen legst du Text-, Zahlen-, Datums- und Ja/Nein-Felder an. Werte füllst du beim Bearbeiten aus. Ausblenden und Archivieren erhalten die Daten; archivierte Werte bleiben lesbar.
      images:
      - file: animal-edit.webp
        alt: Bearbeitungsansicht eines Tieres
        caption: Tier bearbeiten
      - file: animal-details.webp
        alt: Detailansicht eines Tieres
        caption: Tierdetails
    - number: '3'
      heading: Darstellung der Übersichten wählen
      body_html: Sortiere über die Übersicht und schalte die Kategoriegruppen separat ein. Unter <strong>Einstellungen → Darstellung</strong> stehen <strong>Großbildmodus</strong> und darunter <strong>Leere Boxen am Ende anzeigen</strong>. Letzteres ist anfangs aus und stellt Boxen ohne zugewiesene Tiere hinter belegte Boxen; die gewählte Sortierung bleibt je Gruppe erhalten.
      images:
      - file: big-picture-mode.webp
        alt: Tierübersicht im Großbildmodus
        caption: Optionaler Großbildmodus
    - number: '4'
      reverse: true
      heading: Galerie und Tier-PDFs
      body_html: Ergänze Aufnahmen in der Galerie und markiere ein Hauptbild. Tippe auf ein Bild für Vollbild, Zoom und Blättern. In den Tierdetails exportierst du ein Etikett mit frei wählbarer Breite und quadratischem Hauptbild oder ein A4-Datenblatt mit Fütterungs-, Häutungs- und Gewichtshistorie in bis zu drei Spalten. Optional folgen alle Galeriebilder chronologisch, einschließlich Hauptbild, mit vier Bildern pro Seite im Originalformat.
      images:
      - file: gallery.webp
        alt: Bildergalerie eines Tieres
        caption: Bildergalerie
  - id: qr
    number: '02'
    eyebrow: QR-Codes
    heading: Physische Box und Datensatz direkt verbinden
    lead: Ein Box-QR enthält eine permanente Kennung. Der Ausdruck bleibt gültig, wenn sich Tier- oder Boxdaten ändern.
    tone: soft
    steps:
    - number: '5'
      heading: Box-QR-Codes exportieren
      body_html: Unter <strong>Einstellungen → Box-QR-Codes</strong> wählst du aktive/archivierte Boxen und speicherst PNG, ZIP oder A4-PDF. Die PDF-Codegröße ist zwischen 6 und 20 mm einstellbar.
      images:
      - file: qr-pdf-export.webp
        alt: Dialog zum PDF-Export von Box-QR-Codes
        caption: QR-Codes gesammelt als PDF exportieren
    - number: '6'
      reverse: true
      heading: Anbringen und scannen
      body_html: Der Boxscanner steht über <strong>+</strong> in der Boxübersicht, der Fütterungsmodus über <strong>+</strong> in der Tierübersicht. Eine gescannte archivierte Box kann nach Rückfrage wiederhergestellt werden. Beim Erstellen eines Tieres wählt QR die Box; beim Umsetzen sind nur aktive andere Ziele nach Bestätigung erlaubt. Shared-Care-Scanning benötigt vertrauenswürdiges HTTPS und native QR-Unterstützung im Browser; übertragen wird nur die Kennung.
      wide_images: true
      images:
      - file: qr-on-enclosure.webp
        alt: QR-Code an einem Terrarium
        caption: QR-Code am Behälter
      - file: qr-scanner.webp
        alt: QR-Scanner in TerraManager
        caption: Integrierter Scanner
  - id: feeding
    number: '03'
    eyebrow: Fütterungen
    heading: Direkt dokumentieren – einzeln oder per Box-Scan
    lead: Speichere Fütterungen mit Zeitpunkt und optionaler Notiz. Gewichts- und Häutungsereignisse bilden eigene Verläufe.
    steps:
    - number: '7'
      heading: Fütterungshistorie
      body_html: Öffne die Tierhistorie, um Fütterungen anzusehen, zu korrigieren oder zu löschen. Shared Care erlaubt endgültiges Löschen nur Administratoren.
      images:
      - file: feeding-history.webp
        alt: Fütterungshistorie eines Tieres
        caption: Chronologische Fütterungshistorie
    - number: '8'
      reverse: true
      heading: Schnelle Fütterung per Box-Scan
      body_html: Scanne eine Box oder wähle sie manuell, markiere die gefütterten Tiere und speichere Zeit/Notiz. Jedes ausgewählte Tier erhält einen Eintrag; die Gruppe wird gemeinsam gespeichert.
      note_html: <strong>Falsche Box?</strong> „Andere Box scannen“ verwirft den ungespeicherten Fütterungsentwurf und öffnet den Scanner erneut.
      images:
      - file: quick-feeding.webp
        alt: Schnelle Fütterung nach einem Box-Scan
        caption: Mehrere Tiere einer Box auswählen
    - number: '9'
      heading: Häutungen und Gewicht dokumentieren
      body_html: Erfasse Häutungen mit Datum, Uhrzeit und optionaler Notiz. Gewicht wird als positiver Wert in Gramm mit Zeitpunkt erfasst. Verläufe sind zeitlich geordnet und lassen sich nachträglich korrigieren.
      images:
      - file: shedding-history.webp
        alt: Tierdetails mit Aktionen für Häutungen
        caption: Zeitlich geordnete Häutungshistorie
  - id: reminders
    number: '04'
    eyebrow: Erinnerungen
    heading: Individuelle Fütterungsrhythmen im Blick behalten
    lead: Wähle pro Tier ein Tagesintervall oder feste Wochentage mit Uhrzeit und Zeitzone.
    tone: soft
    steps:
    - number: '10'
      heading: Intervall oder Wochentage festlegen
      body_html: Öffne das Erinnerungssymbol in den Tierdetails. Stelle ein positives Tagesintervall oder Wochentage mit Uhrzeit und IANA-Zeitzone ein. Neue Fütterungen verschieben einen festen Wochentagsplan nicht.
      images:
      - file: feeding-reminder-settings.webp
        alt: Einstellungen für eine Fütterungserinnerung
        caption: Individuelles Erinnerungsintervall
    - number: '11'
      reverse: true
      heading: Fällige und bevorstehende Fütterungen erkennen
      body_html: Fällig-Markierungen bieten Fütterung hinzufügen oder Übersichtshinweise für 24 Stunden ausblenden (in Shared Care pro Konto). Terminliste und Detailhinweis bleiben aktiv. <strong>Nächste Fütterung</strong> öffnet die Terminliste. Optional unter <strong>Einstellungen → Android-Benachrichtigungen</strong> lokale Hinweise einschalten; anfangs aus, Freigabe erst beim Einschalten. Web und Shared Care erinnern nur in der App. Android meldet jeden Termin einmal, eventuell verzögert; keine Tierdaten auf dem Sperrbildschirm. Nach erzwungenem Beenden die App öffnen. Das Ausblenden für 24 Stunden schaltet Android-Hinweise nicht stumm.
      images:
      - file: feeding-reminders-due.webp
        alt: Tierübersicht mit mehreren fälligen Fütterungen
        caption: Fällige Fütterungen zentral im Blick
  - id: archive
    number: '05'
    eyebrow: Historie
    heading: Archivieren statt Informationen verlieren
    lead: Archivierte Tiere und Boxen behalten ihre Daten, Bilder und Verläufe und lassen sich wiederherstellen.
    steps:
    - number: '12'
      heading: Archivinformationen erhalten und wiederherstellen
      body_html: Archiviere mit Grund, Datum und optionaler Notiz. Eine Box darf keine aktiven Tiere enthalten. Die Historie sortiert nach Name oder Archivdatum; Wiederherstellen und Duplizieren stehen im Kontextmenü. Ein Tier benötigt beim Wiederherstellen eine aktive Zielbox.
      note_html: „Dauerhaft löschen“ entfernt archivierte Daten endgültig. In Shared Care ist diese Aktion Administratoren vorbehalten.
      images:
      - file: animal-history.webp
        alt: Tierhistorie mit archivierten Tieren
        caption: Sortierte Tierhistorie
      - file: archive-details.webp
        alt: Archivinformationen mit Wiederherstellungsaktion
        caption: Archivdetails und Wiederherstellung
  - id: backup
    number: '06'
    eyebrow: Datensicherung
    heading: Regelmäßig sichern und kontrolliert wiederherstellen
    lead: Portable .tmbackup-Dateien enthalten Sammlung, Bilder, Verläufe und portable Einstellungen. Wiederherstellen ersetzt den Zielbestand.
    tone: dark
    steps:
    - number: '13'
      heading: Safety Backup bei Wiederherstellung
      body_html: Im eigenständigen Modus ist die zusätzliche Sicherheitskopie vor Wiederherstellung standardmäßig aktiviert und für diesen Vorgang abwählbar. Scheitert ihr Speichern oder wird es abgebrochen, beginnt kein Ersetzen.
      note_html: Shared Care verlangt vor dem Ersetzen vorhandener Daten eine aktuelle Sicherheitskopie. Nur eine serverseitig bestätigte leere Sammlung kann sie überspringen. Eine portable Kopie enthält keine Konten; für Serverwiederherstellung beide Datenbanken sichern.
      images:
      - file: restore-safety-backup.webp
        alt: Wiederherstellungsdialog mit aktiviertem Safety Backup
        caption: Safety Backup vor der Wiederherstellung
    - number: '14'
      heading: Sicherung mit Passwort schützen
      body_html: Wähle <strong>Mit Passwort schützen</strong> und bestätige das Passwort. Der Import fragt es vor der Verarbeitung ab; falsches Passwort oder beschädigte Datei werden vor dem Ersetzen abgewiesen. Ältere ungeschützte Sicherungen bleiben lesbar.
      note_html: Ein vergessenes Passwort kann nicht wiederhergestellt werden. TerraManager speichert das Backup-Passwort nicht dauerhaft. Bei großen Sicherungen kann die Verarbeitung mehrere Minuten dauern und auf speicherarmen Geräten scheitern. Fehler oder Abbruch ersetzen die bestehende Sammlung nicht. Eine aktivierte lokale Sicherheitskopie übernimmt beim geschützten Import dasselbe Passwort; Shared Care entschlüsselt im Browser vor dem Senden an den eigenen Server.
  shared_care:
    eyebrow: Optionale gemeinsame Nutzung
    heading: Eine Sammlung auf deinem eigenen Server
    lead: Im Shared-Care-Webmodus greifen mehrere Betreuungspersonen über ihren Browser auf dieselbe Sammlung zu. Ein eigener Server im lokalen Netzwerk speichert Boxen, Tiere, Fütterungen, Verläufe und Bilder. Die eigenständige Android- und Webanwendung bleibt davon getrennt.
    items:
    - title: Zugang und getrennte Sammlung
      body: Der Betreiber richtet Server, lokale Konten und eine vertrauenswürdige HTTPS-Adresse ein. Die Android-Einstellung „Gemeinsame Betreuung“ öffnet den externen Browser. Lokale App-Daten werden nicht automatisch synchronisiert; eine portable Sicherung überträgt den Bestand.
    - title: Automatische Aktualisierung
      body: Änderungen erscheinen ohne Neuladen auf anderen Geräten. Nach Hintergrund oder Verbindungsunterbrechung gleicht der Client die Daten ab. Nicht bestätigte Speichervorgänge prüfen, bevor du erneut speicherst; es gibt keine Offline-Warteschlange. Veraltete Entwürfe überschreiben keine neueren Daten.
    - title: Bedienung und Darstellung
      body: Namen änderst du über Bearbeiten. Kontextmenüs bieten passende Pflege-, Duplizieren-, Archiv- und Wiederherstellungsaktionen. Bilder kannst du bereits beim Anlegen auswählen. Sprache, Sortierung und Darstellung gehören zu deinem Konto; Archive bleiben Vorschaulisten.
    - title: Rollen und Sitzung
      body: Administratoren verwalten Konten, Backups, endgültiges Löschen und Audit. Kontoänderungen melden betroffene Sitzungen ab; der letzte aktive Administrator ist geschützt. Sitzungen enden nach zwölf Stunden, auch bei aktiver Nutzung. Melde dich anschließend erneut an.
    - title: Audit und Sicherung
      body: Das lokale Audit speichert Akteur, Zeitpunkt, Aktion und Datensatzkennung für 365 Tage, keine Notizen, Bilder oder Zugangsdaten. Administratoren filtern es in Einstellungen → Shared server → Audit. Eine portable Sicherung enthält die Sammlung; für vollständige Serverwiederherstellung zusätzlich beide Datenbanken sichern.
    note: Shared Care bleibt vom eigenständigen Bestand getrennt und benötigt einen erreichbaren Server im LAN.
    setup: Einrichtung und Betrieb des eigenen Servers
  finish:
    heading: Das war der Kernworkflow
    body: 'Im Alltag reduziert sich TerraManager damit auf wenige wiederkehrende Schritte: Box identifizieren, Versorgung dokumentieren, Fälligkeiten prüfen und den gewachsenen Datenbestand regelmäßig sichern.'
    download: TerraManager herunterladen
    manual: Handbuch öffnen
  footer:
    tagline: Lokale Terrarienverwaltung von Codefrog.
    nav_label: Fußnavigation
    home: Startseite
    privacy: Datenschutz
    github: GitHub
en:
  locale: en_US
  title: TerraManager Guide – Quick start and daily workflow
  description: Visual TerraManager guide for enclosures, animals, QR codes, feedings, reminders, archiving and backups.
  skip: Skip to content
  nav_label: Guide navigation
  nav:
    start: Quick start
    qr: QR & Scanner
    feeding: Feedings
    backup: Backup
    shared: Shared care
  language_label: Change language
  language_name: Deutsch
  home_label: Home
  hero:
    eyebrow: Visual quick start
    heading: TerraManager in a few steps
    body: From your first enclosure to the daily feeding routine – this guide shows the most important workflows directly in the app.
    primary: Start the guide
    manual: Full manual
    image: animals-overview.webp
    image_alt: Animal overview in TerraManager
  jump:
    heading: Jump to a topic
    items:
    - number: '01'
      target: start
      title: Set up your collection
      body: Add enclosures and animals
    - number: '02'
      target: qr
      title: Use QR codes
      body: Print, attach and scan
    - number: '03'
      target: feeding
      title: Feedings
      body: Individually or by enclosure scan
    - number: '04'
      target: reminders
      title: Reminders
      body: Intervals and due feedings
    - number: '05'
      target: archive
      title: Archive records
      body: Keep history instead of deleting
    - number: '06'
      target: backup
      title: Back up your data
      body: Backup and restore
    - number: '07'
      target: shared-care
      title: Shared care
      body: One collection on your own LAN
  sections:
  - id: start
    number: '01'
    eyebrow: Set up your collection
    heading: Enclosures and animals are the foundation
    lead: Create a Box first, then an Animal assigned to an active Box. Skip the optional introduction or replay it from Settings.
    heading_image:
      file: box_detail.webp
      alt: Enclosure detail view
      caption: Enclosure details
    steps:
    - number: '1'
      heading: Add an enclosure
      body_html: Open <strong>Boxes → +</strong>. Add a name, dimensions and an optional cropped picture. Saving creates the permanent QR identifier. Use <strong>Enclosure care</strong> in Box details for dated substrate changes, cleaning or water changes, with optional notes. Open it from the top right, next to Edit. Entries stay with the enclosure in Standalone and Shared Care. Add and manage custom types directly from the care history using <strong>Custom care types</strong>. Archived types remain filterable in history.
      images:
      - file: boxes-overview.webp
        alt: Enclosure overview with multiple enclosures
        caption: Enclosure overview
      - file: box-create.webp
        alt: Form for creating a new enclosure
        caption: Create a new enclosure
    - number: '2'
      reverse: true
      heading: Add and assign an animal
      body_html: Under <strong>Animals → +</strong>, choose an active Box, category, names and husbandry values. Origin, birth information and other details are optional. Hide Weight or Shedding independently on details without deleting their histories. Under <strong>Custom fields → Manage field templates</strong> in Animal or Box profiles, add text, number, date and yes/no fields. Fill in values when editing. Hiding and archiving preserve data; archived values remain readable.
      images:
      - file: animal-edit.webp
        alt: Animal edit screen
        caption: Edit animal
      - file: animal-details.webp
        alt: Animal detail screen
        caption: Animal details
    - number: '3'
      heading: Choose the overview presentation
      body_html: Use the overview sort control and separate category-group toggle. <strong>Settings → Appearance</strong> offers <strong>Big Picture Mode</strong>, followed by <strong>Show Empty Boxes Last</strong>. The latter defaults to off and places Boxes without assigned Animals after occupied Boxes, retaining the chosen sort order within each group.
      images:
      - file: big-picture-mode-en.webp
        alt: Animal overview using large pictures
        caption: Optional Big Picture Mode
    - number: '4'
      reverse: true
      heading: Gallery and Animal PDFs
      body_html: Add gallery pictures and choose a primary image. Tap a picture for full-screen zoom and navigation. Animal details export either a label with a chosen width and square primary picture, or an A4 profile with feeding, shedding and weight histories in up to three columns. Optionally append all gallery pictures in chronological order, including the primary image, four per page at their original aspect ratios.
      images:
      - file: gallery.webp
        alt: Animal picture gallery
        caption: Picture gallery
  - id: qr
    number: '02'
    eyebrow: QR codes
    heading: Connect the physical enclosure to its record
    lead: A Box QR contains a permanent identifier. The printed label stays valid when Box or Animal data changes.
    tone: soft
    steps:
    - number: '5'
      heading: Export Box QR codes
      body_html: In <strong>Settings → Box QR codes</strong>, select active/archived Boxes and save PNG, ZIP or A4 PDF. PDF code size is adjustable from 6 to 20 mm.
      images:
      - file: qr-pdf-export.webp
        alt: Dialog for exporting enclosure QR codes to PDF
        caption: Export QR codes together as PDF
    - number: '6'
      reverse: true
      heading: Attach and scan
      body_html: The Box scanner sits above <strong>+</strong> in the Box overview; Feeding Mode sits above <strong>+</strong> in the Animal overview. A scanned archived Box offers restoration after confirmation. QR selection during Animal creation chooses the Box; reassignment accepts only another active destination after confirmation. Shared Care scanning requires trusted HTTPS and native browser QR support; only the identifier is sent.
      wide_images: true
      images:
      - file: qr-on-enclosure.webp
        alt: QR code attached to a terrarium
        caption: QR code on the enclosure
      - file: qr-scanner.webp
        alt: QR scanner in TerraManager
        caption: Integrated scanner
  - id: feeding
    number: '03'
    eyebrow: Feedings
    heading: Record feedings directly – individually or by enclosure scan
    lead: Record feeding time and optional notes. Weight and shedding events have their own histories.
    steps:
    - number: '7'
      heading: Feeding history
      body_html: Open an Animal history to view, correct or delete Feedings. Permanent deletion in Shared Care requires an administrator.
      images:
      - file: feeding-history.webp
        alt: Animal feeding history
        caption: Chronological feeding history
    - number: '8'
      reverse: true
      heading: Quick feeding by Box scan
      body_html: Scan or manually choose a Box, select the Animals actually fed, and save the time/notes. Each selected Animal receives an event in one grouped operation.
      images:
      - file: quick-feeding.webp
        alt: Quick feeding after scanning an enclosure
        caption: Select multiple animals from one enclosure
      note_html: <strong>Wrong Box?</strong> Choose “Scan a different Box” to discard the unsaved Feeding draft and return to scanning.
    - number: '9'
      heading: Record shedding and weight
      body_html: Record shedding with date, time and optional notes. Record weight as a positive gram value with its timestamp. Histories are ordered by time and can be corrected later.
      images:
      - file: shedding-history-en.webp
        alt: Animal details with shedding actions
        caption: Timestamped shedding history
  - id: reminders
    number: '04'
    eyebrow: Reminders
    heading: Keep individual feeding schedules in view
    lead: Choose an interval in days or fixed weekdays with a time and time zone for each Animal.
    tone: soft
    steps:
    - number: '10'
      heading: Set an interval or weekdays
      body_html: Open the reminder action in Animal details. Set a positive day interval or weekdays with a time and IANA zone. Recording a Feeding does not shift a fixed weekday schedule.
      images:
      - file: feeding-reminder-settings.webp
        alt: Feeding reminder settings
        caption: Individual reminder interval
    - number: '11'
      reverse: true
      heading: See which animals are due
      body_html: Due markers offer Add Feeding or hide overview alerts for 24 hours (per account in Shared Care). Scheduled feedings and detail reminders stay active. <strong>Next Feeding</strong> opens the schedule. Optionally enable local alerts under <strong>Settings → Android notifications</strong>; off by default, permission requested on enabling. Web and Shared Care keep in-app reminders. Android reports each appointment once, possibly late, without Animal data on the lock screen. Reopen the app after force stop. Hiding alerts for 24 hours does not mute Android notifications.
      images:
      - file: feeding-reminders-due.webp
        alt: Animal overview with several due feedings
        caption: Due feedings at a glance
  - id: archive
    number: '05'
    eyebrow: History
    heading: Archive records instead of losing information
    lead: Archived Animals and Boxes keep their data, pictures and histories and can be restored.
    steps:
    - number: '12'
      heading: Preserve and restore archive information
      body_html: Archive with a reason, date and optional note. A Box must have no active Animals. Sort archives by name or archive date; Restore and Duplicate are available in context menus. Restoring an Animal requires an active destination Box.
      note_html: Permanent deletion removes archived data irreversibly. In Shared Care, this action is administrator-only.
      images:
      - file: animal-history.webp
        alt: Animal History with archived animals
        caption: Sorted Animal History
      - file: archive-details.webp
        alt: Archive information with restore action
        caption: Archive details and restore
  - id: backup
    number: '06'
    eyebrow: Backup
    heading: Back up regularly and restore in a controlled way
    lead: Portable .tmbackup files contain the collection, pictures, histories and portable preferences. Restore replaces the target collection.
    tone: dark
    steps:
    - number: '13'
      heading: Safety backup before restore
      body_html: Standalone enables a pre-restore safety copy by default; you may disable it for that operation. Failed or cancelled safety saving stops replacement.
      note_html: Shared Care requires a current safety copy before replacing existing data. Only a server-confirmed empty collection can skip it. Portable exports exclude accounts; full server recovery needs both databases.
      images:
      - file: restore-safety-backup.webp
        alt: Restore dialog with safety backup enabled
        caption: Safety backup before restore
    - number: '14'
      heading: Protect a backup with a password
      body_html: Choose <strong>Protect with password</strong> and confirm the password. Import asks before processing; a wrong password or damaged file is rejected before replacement. Older unprotected backups remain readable.
      note_html: A forgotten password cannot be recovered. TerraManager does not persist the backup password. Processing a large backup can take several minutes and fail on low-memory devices. Failure or cancellation leaves the collection unchanged. An enabled local safety copy uses the same password when importing a protected file; Shared Care decrypts in the browser before sending to your own server.
  shared_care:
    eyebrow: Optional shared use
    heading: One collection on your own server
    lead: Shared Care Web mode lets several caregivers use the same collection through their browsers. Your own server on the local network stores Boxes, Animals, feedings, histories and pictures. The standalone Android and Web applications remain separate.
    items:
    - title: Access and independent collection
      body: The operator provides a server, local accounts and trusted HTTPS. The Android Shared care setting opens an external browser. Local app data is not automatically synchronized; a portable backup transfers the collection.
    - title: Automatic updates
      body: Changes appear on other devices without reloading. After backgrounding or connection loss, the client reconciles server data. Check an unconfirmed save before retrying; there is no offline write queue. Stale drafts cannot silently overwrite newer data.
    - title: Controls and presentation
      body: Change names through Edit. Context menus offer applicable care, duplicate, archive and restore actions. Select pictures during creation. Language, sorting and presentation belong to your account; archives stay thumbnail lists.
    - title: Roles and sessions
      body: Administrators manage accounts, backups, permanent deletion and audit. Account changes revoke affected sessions; the final active administrator is protected. Sessions expire after twelve hours even during active use; sign in again afterward.
    - title: Audit and backup
      body: Local audit records actor, time, action and record identity for 365 days, without notes, pictures or credentials. Administrators filter it under Settings → Shared server → Audit. Portable backups contain the collection; full server recovery additionally requires both databases.
    note: Shared Care stays separate from standalone collections and requires a reachable LAN server.
    setup: Set up and operate your own server
  finish:
    heading: That is the core workflow
    body: 'For daily use, TerraManager comes down to a few recurring actions: identify the enclosure, record care, check due feedings and regularly back up the growing collection data.'
